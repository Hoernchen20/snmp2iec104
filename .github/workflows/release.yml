name: Release

# Push a tag vX.Y.Z (matching the relx release version in rebar.config):
#   - runs the CI checks
#   - builds the Dockerfile natively on amd64 and arm64
#   - pushes a multi-arch image to ghcr.io/<owner>/snmp2iec104
#     (tags X.Y.Z, X.Y and latest; a pre-release tag vX.Y.Z-rc.1 gets only
#     its own tag)
#   - creates a GitHub release with the release tarballs and SHA256SUMS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          rel=$(sed -n 's/.*{release, {snmp2iec104, "\([^"]*\)"}.*/\1/p' rebar.config)
          tag=${GITHUB_REF_NAME#v}
          echo "rebar.config release version: $rel, tag: $tag"
          if [ "${tag%%-*}" != "$rel" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match release version $rel in rebar.config"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, test]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Release tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Image (pushed by digest, tagged in publish)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}

      - name: Record digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.image.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Multi-arch manifest
        working-directory: digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          opts=(--verify-tag --generate-notes --title "snmp2iec104 $VERSION")
          case "$VERSION" in *-*) opts+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${opts[@]}" ./*.tar.gz SHA256SUMS
