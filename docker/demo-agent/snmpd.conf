# Demo agent: v1/v2c community "public", v3 user "demo" (authPriv,
# SHA / AES, passphrase "demopassword" for both). Test credentials only.
rocommunity public default
createUser demo SHA "demopassword" AES "demopassword"
rouser demo priv

sysLocation  docker compose demo
sysContact   nobody@example.invalid
sysName      demo-agent
sysServices  72

# load averages (UCD-SNMP-MIB::laTable), disk usage (dskTable)
load 12 10 5
includeAllDisks 10%
